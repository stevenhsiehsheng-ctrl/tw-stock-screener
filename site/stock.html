<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>個股查詢</title>
<style>
:root{--bg:#f7f7f5;--fg:#1d1d1b;--muted:#6b6b66;--line:#ddddd6;--link:#2f55c4;--card:#fff;
  --s1:#2a78d6;--pos:#e34948;--neg:#2a78d6;--grid:#e6e5e0;--ref:#9a9890;--good:#0ca30c;--warn:#fab219;--crit:#d03b3b;--up:#d03b3b;--down:#0b8a3a}
@media(prefers-color-scheme:dark){:root{--bg:#141413;--fg:#ecebe6;--muted:#a3a29b;--line:#34342f;--link:#8fa8f5;--card:#1d1d1b;
  --s1:#3987e5;--pos:#e66767;--neg:#3987e5;--grid:#2c2c29;--ref:#77766f;--up:#f06b6b;--down:#3fbf6a}}
body{margin:0;background:var(--bg);color:var(--fg);font:15.5px/1.7 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
a{color:var(--link)}
h1{font-size:23px;line-height:1.35;margin:8px 0 2px}
h2{font-size:17px;margin:26px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.meta{color:var(--muted);font-size:13.5px}
.search{display:flex;gap:8px;margin:4px 0 6px}
.search input{flex:1;min-width:0;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
.search button{font:inherit;padding:8px 14px;border:0;border-radius:10px;background:#2f5bd3;color:#fff;cursor:pointer}
.recent{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.star{font:inherit;font-size:13px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;vertical-align:middle}.star.on{border-color:#eda100;color:#b07800}
#wl{margin:2px 0}
.recent a{padding:2px 10px;border-radius:999px;background:rgba(128,128,128,.13);text-decoration:none;color:inherit}
.hero{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin:4px 0}
.px{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.chg{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.b{font-size:12.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.b.crit{border-color:var(--crit)}.b.warn{border-color:var(--warn)}.b.good{border-color:var(--good)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.tile .k{font-size:12.5px;color:var(--muted)}.tile .v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.chk{list-style:none;padding:0;margin:6px 0}
.chk li{padding:5px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px}
.chk li:last-child{border-bottom:0}
.chk .ic{flex:none;width:20px;text-align:center}
.verdict{font-weight:600;margin:6px 0 2px}
.tbl{overflow-x:auto}table{border-collapse:collapse;font-size:14px;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:600}td.n,th.n{text-align:right}
.chart{position:relative;margin:4px 0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:11px}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 8px;
  font-size:12.5px;line-height:1.45;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.12);display:none;z-index:2}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin:2px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
details summary{cursor:pointer;color:var(--muted);font-size:13.5px}
.empty{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
<style>.sitenav{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 16px;padding:0 0 12px;border-bottom:1px solid rgba(128,128,128,.25);font-size:13px;line-height:1.4}.sitenav a{padding:4px 11px;border-radius:999px;text-decoration:none;color:inherit;background:rgba(128,128,128,.13);white-space:nowrap;cursor:pointer}.sitenav a:hover{background:rgba(128,128,128,.24)}.sitenav a.on{background:#2f5bd3;color:#fff;font-weight:600}.sitenav i{width:1px;height:18px;background:rgba(128,128,128,.35);margin:0 4px}@media(max-width:560px){.sitenav i{display:none}}.sitenav form{margin:0 0 0 auto}.sitenav input{font:inherit;padding:4px 11px;border-radius:999px;width:150px;border:1px solid rgba(128,128,128,.35);background:transparent;color:inherit}@media(max-width:560px){.sitenav form{flex:1 1 100%;margin:2px 0 0}.sitenav input{width:100%;box-sizing:border-box}}</style><nav class='sitenav'><a href='live.html'>⚡ 盤中即時</a><a href='index.html'>📊 每日篩選</a><a class='on' href='stock.html'>🔎 個股查詢</a><a href='screen.html'>🧮 自訂選股</a><a href='#' onclick='return openClaude()'>🔒 Claude 研判</a><i></i><a href='weekly/index.html'>📅 市場週報</a><a href='macro.html'>🌏 大環境</a><a href='chips.html'>🏦 法人籌碼</a><a href='exdiv.html'>💰 除權息</a><a href='usx.html'>🇺🇸 美股篩選</a><a href='us.html'>🌙 美股隔夜</a><a href='revdrift.html'>📈 營收漂移</a><a href='longterm.html'>🌱 長期 Top 20</a><i></i><a href='gifts.html'>🎁 股東紀念品</a><a href='archive.html'>🗂 歷史報表</a></nav><script src='claude_link.js'></script>
<form class="search" id="f"><input id="q" list="dl" placeholder="代號或名稱：2330、台玻、NVDA、蘋果" autocomplete="off"><button>查詢</button></form>
<datalist id="dl"></datalist>
<div class="recent" id="wl"></div>
<div class="recent" id="recent"></div>
<div id="out"><p class="meta">資料每天收盤後更新。輸入代號或名稱開始。</p></div>
</main>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(v,d=2)=>v==null||isNaN(v)?'—':Number(v).toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=(v,d=2)=>v==null||isNaN(v)?'—':(v>0?'+':'')+fmt(v,d);
const cls=v=>v>0?'up':v<0?'down':'';
let INDEX=null;
function getRecent(){try{return JSON.parse(localStorage.getItem('stock_recent')||'[]')}catch(e){return[]}}
function addRecent(c,n){try{const r=getRecent().filter(x=>x[0]!==c);r.unshift([c,n]);localStorage.setItem('stock_recent',JSON.stringify(r.slice(0,8)))}catch(e){}}
function drawRecent(){$('#recent').innerHTML=getRecent().map(([c,n])=>`<a href="?code=${esc(c)}">${esc(c)} ${esc(n)}</a>`).join('')}
function getWL(){try{return JSON.parse(localStorage.getItem('watchlist')||'[]')}catch(e){return[]}}
function setWL(a){try{localStorage.setItem('watchlist',JSON.stringify(a))}catch(e){}}
function star(c,n){const on=getWL().some(x=>x[0]===c);return `<button class="star${on?' on':''}" onclick="toggleWL('${esc(c)}','${esc(n).replace(/'/g,'')}',this)" title="${on?'從自選移除':'加入自選'}">${on?'★ 自選':'☆ 加自選'}</button>`}
function toggleWL(c,n,btn){let a=getWL();const on=a.some(x=>x[0]===c);a=on?a.filter(x=>x[0]!==c):[...a,[c,n]];setWL(a);btn.outerHTML=star(c,n);drawWL()}
function drawWL(){const a=getWL();$('#wl').innerHTML=a.length?'⭐ 自選：'+a.map(([c,n])=>`<a href="?code=${esc(c)}">${esc(n||c)}</a>`).join(''):''}
async function loadIndex(){if(INDEX)return INDEX;try{INDEX=await (await fetch('stocks/index.json')).json()}catch(e){INDEX={s:[]}}
  $('#dl').innerHTML=INDEX.s.map(([c,n])=>`<option value="${esc(c)} ${esc(n)}">`).join('');return INDEX}
function resolve(q){q=q.trim();if(!q)return null;const code=q.split(/\s+/)[0].toUpperCase();const ql=q.toLowerCase();
  const s=INDEX.s;let h=s.find(x=>x[0]===code)||s.find(x=>x[1]===q)||s.find(x=>x[1].toLowerCase().includes(ql))||s.find(x=>x[0].startsWith(code));return h?h[0]:null}
$('#f').onsubmit=async e=>{e.preventDefault();await loadIndex();const c=resolve($('#q').value);
  if(!c){$('#out').innerHTML=`<p class="empty">找不到「${esc($('#q').value)}」。</p>`;return}
  history.pushState(null,'','?code='+c);show(c)};
/* 網址帶名稱（例如導覽列搜尋 ?code=台積電）也能開：先解析成代號，網址換成代號 */
function fromURL(){const c=new URLSearchParams(location.search).get('code');if(!c)return null;const r=resolve(c);
  if(r&&r!==c)history.replaceState(null,'','?code='+r);if(!r&&!/^[0-9A-Za-z]{4,6}$/.test(c)&&INDEX.s.length){$('#q').value=c;$('#out').innerHTML=`<p class="empty">找不到「${esc(c)}」。</p>`;return null}return r||c}
window.onpopstate=()=>{const c=fromURL();if(c)show(c)};

/* ---------- 圖：共用 hover ---------- */
function hover(box,svg,n,xAt,tipHtml,onMove){const tip=document.createElement('div');tip.className='tip';box.appendChild(tip);
  const line=svg.querySelector('.cross');
  function at(ev){const r=svg.getBoundingClientRect();const vb=svg.viewBox.baseVal;const x=(ev.clientX-r.left)*vb.width/r.width;
    let i=0,best=1e9;for(let k=0;k<n;k++){const d=Math.abs(xAt(k)-x);if(d<best){best=d;i=k}}return i}
  function mv(ev){const i=at(ev);tip.innerHTML=tipHtml(i);tip.style.display='block';const r=svg.getBoundingClientRect(),br=box.getBoundingClientRect();
    const px=xAt(i)*r.width/svg.viewBox.baseVal.width;let left=px+12;if(left+tip.offsetWidth>br.width)left=px-tip.offsetWidth-12;
    tip.style.left=Math.max(0,left)+'px';tip.style.top='4px';if(line){line.setAttribute('x1',xAt(i));line.setAttribute('x2',xAt(i));line.style.display=''}onMove&&onMove(i)}
  function out(){tip.style.display='none';if(line)line.style.display='none'}
  svg.addEventListener('pointermove',mv);svg.addEventListener('pointerdown',mv);svg.addEventListener('pointerleave',out)}
let W=760;const fitW=box=>{W=Math.max(300,Math.round(box.clientWidth||760))};
function niceTicks(lo,hi,n=4){const span=hi-lo||1,step0=span/n,p=Math.pow(10,Math.floor(Math.log10(step0))),m=[1,2,2.5,5,10].find(m=>m*p>=step0)*p;
  const out=[];for(let v=Math.ceil(lo/m)*m;v<=hi+1e-9;v+=m)out.push(+v.toFixed(6));return out}
function priceChart(box,o){fitW(box);const d=o.px.d,c=o.px.c,v=o.px.v,n=c.length;if(n<2){box.innerHTML='<p class="empty">資料不足</p>';return}
  const H=W<500?200:220,VH=W<500?44:60,L=8,R=46,T=10,B=18;const vals=c.filter(x=>x!=null);let lo=Math.min(...vals),hi=Math.max(...vals);
  const tr=o.trig&&o.trig.hi?o.trig:null;if(tr){hi=Math.max(hi,tr.need)}const pad=(hi-lo)*.06||1;lo-=pad;hi+=pad;
  const X=i=>L+(W-L-R)*i/(n-1),Y=p=>T+(H-T-B)*(1-(p-lo)/(hi-lo));
  let path='';c.forEach((p,i)=>{if(p!=null)path+=(path?'L':'M')+X(i).toFixed(1)+' '+Y(p).toFixed(1)});
  const ticks=niceTicks(lo,hi);const vmax=Math.max(...v,1);const bw=Math.max(1,(W-L-R)/n-1);
  const months=[];d.forEach((x,i)=>{if(i===0||x.slice(5,7)!==d[i-1].slice(5,7))months.push(i)});
  let s=`<svg viewBox="0 0 ${W} ${H+VH+8}" role="img" aria-label="近一年收盤價與成交量">`;
  s+=ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)"/><text x="${W-R+4}" y="${Y(t)+4}">${t}</text>`).join('');
  s+=months.filter((_,k)=>k%(W<500?3:2)===0).map(i=>`<text x="${X(i)}" y="${H-2}">${d[i].slice(2,7).replace('-','/')}</text>`).join('');
  if(tr){const y=Y(tr.hi),y2=Y(tr.need);s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--ref)" stroke-dasharray="4 4"/>`+
    `<text x="${L+2}" y="${y-4}">${tr.nh} 日最高 ${tr.hi}</text>`;
    if(Math.abs(y2-y)>12)s+=`<line x1="${W-R-120}" x2="${W-R}" y1="${y2}" y2="${y2}" stroke="var(--pos)" stroke-dasharray="2 3"/><text x="${W-R-120}" y="${y2-4}">明天觸發價 ${tr.need}</text>`}
  s+=`<path d="${path}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>`;
  s+=`<line class="cross" y1="${T}" y2="${H+VH}" stroke="var(--ref)" style="display:none"/>`;
  const vy0=H+8;s+=v.map((x,i)=>{const h=VH*x/vmax;return `<rect x="${X(i)-bw/2}" y="${vy0+VH-h}" width="${bw}" height="${Math.max(h,.5)}" fill="var(--ref)" opacity=".55"/>`}).join('');
  s+=`<text x="${W-R+4}" y="${vy0+10}">量</text></svg>`;box.innerHTML=s;
  hover(box,box.querySelector('svg'),n,X,i=>`${d[i]}<br>收盤 <b>${fmt(c[i])}</b><br>成交 ${fmt(v[i],0)} ${o.market==='US'?'千股':'張'}`)}
function divBars(box,rows,label,unit,dp){/* rows: [[x, v]] 正＝紅、負＝藍 */fitW(box);const n=rows.length;if(!n){box.innerHTML='<p class="empty">沒有資料</p>';return}
  const H=150,L=8,R=46,T=8,B=18;const vs=rows.map(r=>r[1]??0);let lo=Math.min(0,...vs),hi=Math.max(0,...vs);if(lo===hi)hi=1;
  const X=i=>L+(W-L-R)*(i+.5)/n,Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo)),bw=Math.max(2,(W-L-R)/n-2);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">`;
  s+=niceTicks(lo,hi,3).map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)"/><text x="${W-R+4}" y="${Y(t)+4}">${t}</text>`).join('');
  s+=`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ref)"/>`;
  s+=`<line class="cross" y1="${T}" y2="${H-B}" stroke="var(--ref)" style="display:none"/>`;
  s+=rows.map((r,i)=>{const v=r[1];if(v==null)return'';const y=Math.min(Y(v),Y(0)),h=Math.max(Math.abs(Y(v)-Y(0)),1);
    return `<rect x="${X(i)-bw/2}" y="${y}" width="${bw}" height="${h}" rx="${Math.min(3,bw/2)}" fill="var(${v>=0?'--pos':'--neg'})"/>`}).join('');
  const step=Math.ceil(n/6);s+=rows.map((r,i)=>i%step===0?`<text x="${X(i)-10}" y="${H-3}">${esc(String(r[0]).slice(2))}</text>`:'').join('');
  s+='</svg>';box.innerHTML=s;hover(box,box.querySelector('svg'),n,X,i=>`${esc(rows[i][0])}<br>${esc(label)} <b>${sgn(rows[i][1],dp)}</b>${unit}`)}

function lines(box,d,S,unit){/* S: [[名稱, 值陣列, 顏色變數]]，共用 x 軸 d */fitW(box);const n=d.length;if(n<2){box.innerHTML='<p class="empty">資料不足</p>';return}
  const H=170,L=8,R=58,T=8,B=18;const vs=S.flatMap(x=>x[1]).filter(v=>v!=null);let lo=Math.min(0,...vs),hi=Math.max(0,...vs);if(lo===hi)hi=lo+1;const pad=(hi-lo)*.05;lo-=pad;hi+=pad;
  const X=i=>L+(W-L-R)*i/(n-1),Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(S.map(x=>x[0]).join('、'))}">`;
  s+=niceTicks(lo,hi,3).map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)"/><text x="${W-R+4}" y="${Y(t)+4}">${Math.abs(t)>=1e4?(t/1e4).toFixed(Math.abs(t)>=1e5?0:1)+'萬':t}</text>`).join('');
  s+=`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ref)"/>`;
  s+=`<line class="cross" y1="${T}" y2="${H-B}" stroke="var(--ref)" style="display:none"/>`;
  S.forEach(([nm,v,c])=>{let p='';v.forEach((y,i)=>{if(y!=null)p+=(p?'L':'M')+X(i).toFixed(1)+' '+Y(y).toFixed(1)});s+=`<path d="${p}" fill="none" stroke="var(${c})" stroke-width="2" stroke-linejoin="round"/>`});
  const yrs=[];d.forEach((x,i)=>{if(i>0&&x.slice(0,4)!==d[i-1].slice(0,4))yrs.push(i)});
  s+=yrs.map(i=>`<text x="${X(i)}" y="${H-3}">${d[i].slice(0,4)}</text>`).join('');
  s+='</svg>';box.innerHTML=s;hover(box,box.querySelector('svg'),n,X,i=>`${esc(d[i])} 那週<br>`+S.map(([nm,v])=>`${esc(nm)} <b>${sgn(v[i],0)}</b>${unit}`).join('<br>'))}

function showUS(o){const c=o.px.c,last=c[c.length-1],F=o.fund||{};const h=[];const money=v=>v==null?'—':'$'+fmt(v,2);
  h.push(`<h1>${esc(o.name)} ${star(o.code,o.name)} <span class="meta">${esc(o.code)}・美股${o.name_en&&o.name_en!==o.name?'・'+esc(o.name_en):''}</span></h1>`);
  h.push(`<div class="meta">${esc(o.industry||'')}</div>`);
  h.push(`<div class="hero"><span class="px">$${fmt(last)}</span><span class="chg ${cls(o.chg)}">${o.chg>0?'▲':o.chg<0?'▼':''} ${sgn(o.chg)}%</span><span class="meta">${esc(o.last)} 美股收盤（還原價）</span></div>`);
  const b=[];(o.group||'').split('+').filter(Boolean).forEach(g=>b.push(`<span class="b">${{SP500:'S&P 500',NDX:'那斯達克 100',ETF:'ETF',ADR:'ADR'}[g]||esc(g)}</span>`));
  if(F.next_earn){const dd=(new Date(F.next_earn)-new Date(o.asof))/864e5;b.push(`<span class="b ${dd>=0&&dd<=14?'warn':''}">📅 下次財報 ${esc(F.next_earn)}${dd>=0&&dd<=14?'（兩週內）':''}</span>`)}
  (o.strats||[]).filter(x=>x[0]===o.asof).forEach(x=>b.push(`<span class="b">📊 今天上榜：${esc(x[1])}</span>`));
  if(b.length)h.push(`<div class="badges">${b.join('')}</div>`);
  h.push('<h2>近一年走勢</h2>');
  h.push(`<div class="grid"><div class="tile"><div class="k">一年最高</div><div class="v">${money(o.hi52)}</div></div><div class="tile"><div class="k">一年最低</div><div class="v">${money(o.lo52)}</div></div><div class="tile"><div class="k">距一年高</div><div class="v">${sgn((last/o.hi52-1)*100,1)}%</div></div></div>`);
  h.push('<div class="chart" id="cpx"></div>');
  h.push('<h2>基本面</h2>');
  if(o.fund){const T=(k,v)=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`,P=(v,d=1)=>v==null?'—':fmt(v,d)+'%';
    h.push(`<div class="grid">${T('市值',F.mcap==null?'—':fmt(F.mcap,1)+' 十億美元')}${T('本益比',F.pe==null?'—':fmt(F.pe,1))}${T('預估本益比',F.fpe==null?'—':fmt(F.fpe,1))}${T('股價淨值比',F.pb==null?'—':fmt(F.pb,2))}
      ${T('殖利率',P(F.yield,2))}${T('營收年增',P(F.rev_g))}${T('獲利年增',P(F.eps_g))}${T('毛利率',P(F.gross_m))}${T('營益率',P(F.op_m))}${T('ROE',P(F.roe))}
      ${T('Beta',F.beta==null?'—':fmt(F.beta,2))}${T('空單占流通股',P(F.short_pct))}
