# 監理服務網機車考照預約小幫手：設定檔範例
# 用法：把這個檔案複製一份，改名成 config.yaml（同一個資料夾），再改成你的資料。
# config.yaml 有你的個人資料，已經設定成不會被上傳到 GitHub。
#
# YAML 格式注意：縮排用「空格」不要用 Tab；冒號後面要空一格。

# dry_run：測試模式。有空位時幫你填好資料，但「不按送出」，讓你自己確認後按。
# book   ：全自動。有空位就填好資料並送出報名（報名頁有驗證碼時會叫你輸入，輸入完自動送出）。
# 建議先用 dry_run 跑成功一次，確認資料都填對了，再改成 book。
mode: dry_run

target:
  license_label: 普通重型機車      # 報考照類，照網頁上的字寫：普通重型機車 / 普通輕型機車
  office_label: 臺北區監理所       # 監理所（台/臺都可以），例如：臺北市區監理所、臺北區監理所、新竹區監理所、
                                   #   臺中區監理所、嘉義區監理所、高雄區監理所、高雄市區監理所
  station_label: 板橋監理站        # 監理站／考場；不確定怎麼寫，先跑一次偵察模式（recon）看清單
  date_from:                       # 最早可以考的日期（西元，例如 2026-10-20）；空白＝最早可預約的那天
  date_to:                         # 最晚可以考的日期；空白＝30 天內都可以
  weekdays: [1, 2, 3, 4, 5, 6, 7]  # 可以考的星期（1＝星期一 … 7＝星期日），例如只要週末：[6, 7]
  weekend_only: false              # 勾選網頁上的「僅查周末及假日場次」

  # 場次組別：同一天常分好幾組，有的只給「重考」或「免講習」的人。
  # 第一次考照（要上安全講習）通常要選寫著「初考」的組別。各監理站寫法不一樣，
  # 程式執行時會把看到的組別印出來，照著調整即可。留空＝不限。
  group_include: "初考"            # 組別說明要「包含」這些字（用 | 隔開代表「或」）
  group_exclude: "免講習|補考|重考" # 組別說明有這些字就「不要」

applicant:                         # 要跟你登錄危險感知紀錄時填的一模一樣
  id_no: ""                        # 身分證字號，例如 "A123456789"
  birth:                           # 出生日期，用西元寫，例如 2005-07-02；程式會自動轉成民國格式
  name: ""                         # 姓名，例如 "王小明"
  mobile: ""                       # 手機，例如 "0912345678"（要加引號）
  email: ""                        # Email，例如 "you@gmail.com"（網頁有要求才會填）
  # 網頁上如果有程式認不得的欄位，可以在這裡指定：「欄位名稱的一部分: 要填的值」
  extra: {}
  # extra:
  #   性別: 男
  #   縣市: 新北市

# 報名前如果有「注意事項／我已閱讀並同意」，自動幫你勾選、按同意
auto_agree: true

captcha:
  timeout_s: 180          # 有驗證碼時，最多等你幾秒
  submit_when_full: true  # 驗證碼打滿長度就自動送出（不用按 Enter）

# 多久查一次網站（秒）。不要調太快，以免被網站封鎖。
poll:
  base_s: 90              # 平常每 90 秒左右查一次
  jitter_s: 30            # 每次隨機加減幾秒，比較像真人
  windows:                # 特定時段改用不同速度（台灣時間）
    - "07:58-08:20@20"    # 每天 08:00 釋出新名額，前後每 20 秒查一次
    - "01:00-06:30@600"   # 半夜很少有人取消，10 分鐘查一次

notify:
  sound: true             # 有空位時發出聲音
  desktop: true           # 跳出電腦桌面通知
  email:
    enabled: false        # 要寄 Email 通知就改成 true
    smtp_user: ""         # 你的 Gmail 完整地址，例如 "abc@gmail.com"
    smtp_password: ""     # Gmail「應用程式密碼」16 碼（不是你的登入密碼），申請：https://myaccount.google.com/apppasswords
    mail_to: ""           # 收件信箱；空白＝寄給自己（smtp_user）

browser:
  channel:                # 空白＝用 Playwright 內建的 Chromium；Windows 也可以填 msedge 直接用 Edge
