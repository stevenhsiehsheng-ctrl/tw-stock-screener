name: 更新網頁版面

# 只改網頁版面（report.py、live_page.html）時，用現有資料重新產生 site/ 並發佈，不用等每日排程。
on:
  push:
    branches: [main]
    paths:
      - screener/report.py
      - screener/live_page.html
      - screener/rebuild.py
      - screener/weekly.py
      - screener/gifts.py
      - screener/revdrift.py
      - data/weekly/**
      - data/gifts/**
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 自己一個佇列：不用等每日排程、補抓（補抓一跑兩小時，排在後面網頁就要等兩小時）。
# 推送前一律重抓最新 main 再重畫，就算每日排程剛推了新報表也不會蓋掉。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 抓最新的 main（預設是觸發當下的版本，排隊期間別的排程推的資料會被漏掉，推送時二進位檔衝突）
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 用現有資料重畫網頁並儲存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 每次都從最新的 main 重畫：推送失敗（別的排程剛推了資料）就丟掉這次的結果，重抓再畫一次
          ok=0; for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python -m screener.rebuild
            git add site
            if git diff --cached --quiet; then echo "沒有變更"; ok=1; break; fi
            git commit -q -m "網頁版面更新 $(TZ=Asia/Taipei date '+%F %H:%M')"
            if git push -q origin HEAD:main; then ok=1; break; fi
            sleep 10
          done; [ "$ok" = 1 ]
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: rebuild
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
