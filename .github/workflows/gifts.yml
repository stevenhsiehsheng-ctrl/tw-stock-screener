name: 股東紀念品

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "只印出候選資料來源的格式"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: gifts
  cancel-in-progress: false

jobs:
  gifts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 測試資料來源
        if: ${{ inputs.probe }}
        run: python -m screener.gifts --probe
