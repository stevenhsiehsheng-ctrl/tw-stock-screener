name: 補抓籌碼與營收歷史

# 一次性：融資融券／當沖往前補 N 個交易日（預設 250 ≈ 一年，約 1 小時）、月營收補到 24 個月。
# 每日排程本來就會每次補 25 天，這個只是讓歷史一次補齊。
on:
  workflow_dispatch:
    inputs:
      days:
        description: "融資融券／當沖往前補幾個交易日"
        default: "250"
      dt_years:
        description: "改成只補當沖長歷史幾年（研究用，存 daytrade_5y.csv.gz，一次最多跑 130 分鐘，沒補完再跑一次；留空＝照舊補融資融券）"
        default: ""

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 抓最新的 main（預設是觸發當下的版本，排隊期間別的排程推的資料會被漏掉，推送時二進位檔衝突）
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 補抓
        if: ${{ inputs.dt_years == '' || inputs.dt_years == null }}
        run: python -m screener.enrich --backfill-chips ${{ inputs.days }} --date "$(TZ=Asia/Taipei date +%F)"
      - name: 當沖長歷史
        if: ${{ inputs.dt_years != '' && inputs.dt_years != null }}
        run: |
          git fetch origin backtest-data && git show origin/backtest-data:backtest.csv.gz > /tmp/bt.csv.gz || true
          python -m screener.enrich --dt-years "${{ inputs.dt_years }}" --dt-budget 130 --bt /tmp/bt.csv.gz --date "$(TZ=Asia/Taipei date +%F)"
      - name: 存檔
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/extras
          if git diff --cached --quiet; then echo "沒有變更"; else
            git commit -m "補抓籌碼與營收歷史 $(TZ=Asia/Taipei date +%F)"
            # 別的排程剛好也推了資料時：重試，衝突的檔案以這次新產生的為準
            ok=0; for i in 1 2 3; do
              if git pull --rebase -X theirs && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true; sleep 5
            done; [ "$ok" = 1 ]
          fi
