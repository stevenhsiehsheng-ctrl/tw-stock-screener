name: 傍晚補抓消息面

# 15:20 每日資料跑的時候，證交所的三大法人（T86）和本益比（BWIBBU）常常還沒公布，
# 結果 inst.csv 只有上櫃、pe.csv 停在前幾天，隔天盤中頁上市股的外資、本益比就是空的。
# 18:05 官方都公布了，再把消息面／籌碼面重抓一次。
on:
  schedule:
    - cron: "5 10 * * 1-5"   # 10:05 UTC = 台北 18:05
    # 備援：GitHub 排程常晚好幾小時（10/9 00:56、10/10 00:33、10/13 03:45 才跑，10/13 那班到半夜都沒跑），
    # 避開整點（整點最塞）再排一班 21:47；重跑結果一樣。隔天 08:40 系統體檢還缺會再補一次。
    - cron: "47 13 * * 1-5"  # 13:47 UTC = 台北 21:47
  workflow_dispatch:
    inputs:
      date:
        description: "資料日期 YYYY-MM-DD（留空＝今天；系統體檢隔天早上補跑時會帶前一個交易日）"
        default: ""
      dispo_years:
        description: "另外把處置公告往回補幾年（研究用，留空＝不補）"
        default: ""
      attn_years:
        description: "另外把注意股公告往回補幾年（研究用，留空＝不補）"
        default: ""
      oddlot_days:
        description: "另外把盤後零股往回補幾個交易日（留空＝不補）"
        default: ""
      rev_months:
        description: "另外把月營收往回補幾個月（研究用，留空＝不補）"
        default: ""
      exdiv_years:
        description: "另外把除權息往回補幾年（研究用，存 exdiv_5y.csv.gz，幾分鐘；留空＝不補）"
        default: ""
      inst_years:
        description: "另外把三大法人往回補幾年（研究用，一次最多 25 分鐘，沒補完就再跑一次；週末跑，別擋到平日 15:20）"
        default: ""

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # 資料日期：有指定就用；沒指定用 history 最新交易日。GitHub 排程常拖到半夜才跑（10/13 那班 03:45），
      # 以前用「當下日期」會去抓還沒開盤的隔天：本益比、當天法人抓不到（融資、法人歷史有往回補才沒漏）
      - name: 決定資料日期
        env:
          IN: ${{ inputs.date }}
        run: |
          D="${IN:-$(python -c "import pandas as p; print(p.read_csv('data/history.csv.gz', usecols=['date']).date.max())")}"
          echo "D=$D" >> "$GITHUB_ENV"
          echo "資料日期 $D（現在台北 $(TZ=Asia/Taipei date '+%F %H:%M')）"
      - name: 重抓
        run: python -m screener.enrich --refresh --date "$D"
      - name: 處置長歷史
        if: ${{ inputs.dispo_years != '' && inputs.dispo_years != null }}
        run: python -m screener.enrich --dispo-years "${{ inputs.dispo_years }}" --date "$(TZ=Asia/Taipei date +%F)"
      - name: 月營收長歷史
        if: ${{ inputs.rev_months != '' && inputs.rev_months != null }}
        run: python -m screener.enrich --rev-months "${{ inputs.rev_months }}" --date "$(TZ=Asia/Taipei date +%F)"
      # 15:20 每日資料抓盤後零股時，櫃買常還沒公布（10/7、10/8、10/12 上櫃都是 0 列）；
      # 18:05 這班每天順手補近 5 個交易日裡缺一邊市場的日子（兩邊都有的日子會跳過，平常幾乎不花時間）
      - name: 盤後零股回補
        run: python -m screener.enrich --oddlot-days "${{ inputs.oddlot_days || '5' }}" --date "$D" || echo "盤後零股回補失敗（不擋後面存檔）"
      - name: 除權息長歷史
        if: ${{ inputs.exdiv_years != '' && inputs.exdiv_years != null }}
        run: python -c "import logging; logging.basicConfig(level=logging.INFO); from screener import exdiv; print(exdiv.backfill_long(float('${{ inputs.exdiv_years }}')))"
      - name: 三大法人長歷史
        if: ${{ inputs.inst_years != '' && inputs.inst_years != null }}
        run: python -m screener.enrich --inst-years "${{ inputs.inst_years }}" --date "$(TZ=Asia/Taipei date +%F)"
      - name: 注意股長歷史
        if: ${{ inputs.attn_years != '' && inputs.attn_years != null }}
        run: python -m screener.enrich --attn-years "${{ inputs.attn_years }}" --date "$(TZ=Asia/Taipei date +%F)"
      - name: 存檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/extras
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "傍晚補抓消息面 $D（跑於 $(TZ=Asia/Taipei date '+%m-%d %H:%M')）"
          ok=0; for i in 1 2 3; do
            if git pull --rebase -X theirs && git push; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true; sleep 5
          done; [ "$ok" = 1 ]
