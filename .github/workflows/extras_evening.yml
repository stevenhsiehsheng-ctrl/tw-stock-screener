name: 傍晚補抓消息面

# 15:20 每日資料跑的時候，證交所的三大法人（T86）和本益比（BWIBBU）常常還沒公布，
# 結果 inst.csv 只有上櫃、pe.csv 停在前幾天，隔天盤中頁上市股的外資、本益比就是空的。
# 18:05 官方都公布了，再把消息面／籌碼面重抓一次。
on:
  schedule:
    - cron: "5 10 * * 1-5"   # 10:05 UTC = 台北 18:05
  workflow_dispatch:
    inputs:
      dispo_years:
        description: "另外把處置公告往回補幾年（研究用，留空＝不補）"
        default: ""
      attn_years:
        description: "另外把注意股公告往回補幾年（研究用，留空＝不補）"
        default: ""
      oddlot_days:
        description: "另外把盤後零股往回補幾個交易日（留空＝不補）"
        default: ""
      rev_months:
        description: "另外把月營收往回補幾個月（研究用，留空＝不補）"
        default: ""

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 重抓
        run: python -m screener.enrich --refresh --date "$(TZ=Asia/Taipei date +%F)"
      - name: 處置長歷史
        if: ${{ inputs.dispo_years != '' && inputs.dispo_years != null }}
        run: python -m screener.enrich --dispo-years "${{ inputs.dispo_years }}" --date "$(TZ=Asia/Taipei date +%F)"
      - name: 月營收長歷史
        if: ${{ inputs.rev_months != '' && inputs.rev_months != null }}
        run: python -m screener.enrich --rev-months "${{ inputs.rev_months }}" --date "$(TZ=Asia/Taipei date +%F)"
      - name: 盤後零股回補
        if: ${{ inputs.oddlot_days != '' && inputs.oddlot_days != null }}
        run: python -m screener.enrich --oddlot-days "${{ inputs.oddlot_days }}" --date "$(TZ=Asia/Taipei date +%F)"
      - name: 注意股長歷史
        if: ${{ inputs.attn_years != '' && inputs.attn_years != null }}
        run: python -m screener.enrich --attn-years "${{ inputs.attn_years }}" --date "$(TZ=Asia/Taipei date +%F)"
      - name: 存檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/extras
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "傍晚補抓消息面 $(TZ=Asia/Taipei date +%F)"
          ok=0; for i in 1 2 3; do
            if git pull --rebase -X theirs && git push; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true; sleep 5
          done; [ "$ok" = 1 ]
