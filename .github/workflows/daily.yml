name: 台股每日篩選

on:
  schedule:
    # GitHub 用 UTC 時間。07:20 UTC = 台北 15:20；09:40 UTC = 台北 17:40（補跑，已處理過會自動略過）
    - cron: "20 7 * * 1-5"
    - cron: "40 9 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "資料日期 YYYY-MM-DD（留空 = 今天）"
        required: false
      force:
        description: "已處理過也強制重跑"
        type: boolean
        default: false
      test:
        # cron-job.org 觸發時 body 會帶 test（和盤中監控共用設定），沒定義的話 GitHub 會回 422 拒絕
        description: "測試：不發通知"
        required: false
        default: "false"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # 第一次延長歷史到 260 天時要往前補抓約 20 分鐘
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 抓最新的 main（預設是觸發當下的版本，排隊期間別的排程推的資料會被漏掉，推送時二進位檔衝突）

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 抓資料並篩選
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_URL: ${{ vars.REPORT_URL }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.test }}" = "true" ]; then ARGS="$ARGS --no-email"; fi
          python -m screener.main $ARGS

      - name: 儲存歷史資料與報表
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site 2>/dev/null || git add data 2>/dev/null || true
          if git diff --cached --quiet; then echo "沒有變更"; else
            # 訊息用資料本身的最新交易日，不用跑的當下日期（GitHub 排程常延遲好幾小時，半夜跑出來會被誤認成隔天的資料）
            D=$(python -c "import pandas as p; print(p.read_csv('data/history.csv.gz', usecols=['date']).date.max())" 2>/dev/null || TZ=Asia/Taipei date +%F)
            git commit -m "每日資料 $D（跑於 $(TZ=Asia/Taipei date '+%m-%d %H:%M')）"
            # 別的排程剛好也推了資料時：重試，衝突的檔案以這次新產生的為準
            ok=0; for i in 1 2 3; do
              if git pull --rebase -X theirs && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true; sleep 5
            done; [ "$ok" = 1 ]
          fi

      - name: 準備網頁
        if: hashFiles('site/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: screen
    runs-on: ubuntu-latest
    continue-on-error: true   # 沒開 GitHub Pages 也不會讓整個流程失敗
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
