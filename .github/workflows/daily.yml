name: 台股每日篩選

on:
  schedule:
    # GitHub 用 UTC 時間。07:20 UTC = 台北 15:20；09:40 UTC = 台北 17:40（補跑，已處理過會自動略過）
    - cron: "20 7 * * 1-5"
    - cron: "40 9 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "資料日期 YYYY-MM-DD（留空 = 今天）"
        required: false
      force:
        description: "已處理過也強制重跑"
        type: boolean
        default: false
      test:
        # cron-job.org 觸發時 body 會帶 test（和盤中監控共用設定），沒定義的話 GitHub 會回 422 拒絕
        description: "測試：不發通知"
        required: false
        default: "false"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
  actions: write   # 傍晚補抓由這裡準時叫（evening1／evening2）

# 排隊只鎖「抓資料」那個 job；部署網站另外排（部署卡在 waiting 時不會擋到盤中監控、補抓、明天的排程）
jobs:
  screen:
    concurrency:
      group: screener
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90   # 第一次延長歷史到 260 天時要往前補抓約 20 分鐘
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 抓最新的 main（預設是觸發當下的版本，排隊期間別的排程推的資料會被漏掉，推送時二進位檔衝突）

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 抓資料並篩選
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_URL: ${{ vars.REPORT_URL }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.test }}" = "true" ]; then ARGS="$ARGS --no-email"; fi
          python -m screener.main $ARGS

      - name: 儲存歷史資料與報表
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site 2>/dev/null || git add data 2>/dev/null || true
          if git diff --cached --quiet; then echo "沒有變更"; else
            # 訊息用資料本身的最新交易日，不用跑的當下日期（GitHub 排程常延遲好幾小時，半夜跑出來會被誤認成隔天的資料）
            D=$(python -c "import pandas as p; print(p.read_csv('data/history.csv.gz', usecols=['date']).date.max())" 2>/dev/null || TZ=Asia/Taipei date +%F)
            git commit -m "每日資料 $D（跑於 $(TZ=Asia/Taipei date '+%m-%d %H:%M')）"
            # 別的排程剛好也推了資料時：重試，衝突的檔案以這次新產生的為準
            ok=0; for i in 1 2 3; do
              if git pull --rebase -X theirs && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true; sleep 5
            done; [ "$ok" = 1 ]
          fi

      - name: 準備網頁
        if: hashFiles('site/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # 櫃買盤後零股 15:20 常常還沒公布（10/7、10/8、10/12、10/13 上櫃都 0 列），虛擬帳戶 15:47 收盤結算要用。
  # 抓資料那個 job 推完後另外等：每 3 分鐘重抓一次，抓到就存檔，最晚等到 16:40（再晚交給傍晚補抓／隔天早上體檢）。
  # 不排進 screener 佇列，不擋盤中監控、補抓、網站部署。log 會印出抓到的時間，用來看櫃買幾點公布。
  oddtpex:
    needs: screen
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 等櫃買盤後零股
        run: |
          D=$(python -c "import pandas as p; print(p.read_csv('data/history.csv.gz', usecols=['date']).date.max())")
          if [ "$D" != "$(TZ=Asia/Taipei date +%F)" ]; then echo "最新資料日 $D 不是今天，不等"; exit 0; fi
          has() { python -c "import pandas as p, sys; o = p.read_csv('data/extras/oddlot_hist.csv.gz', usecols=['date', 'market']); sys.exit(0 if ((o.date == '$D') & (o.market == 'TPEX')).any() else 1)"; }
          if has; then echo "櫃買盤後零股 $D 已經有了"; exit 0; fi
          while true; do
            python -m screener.enrich --oddlot-days 1 --date "$D" || true
            if has; then echo "櫃買盤後零股 $D 到了（台北 $(TZ=Asia/Taipei date +%H:%M) 抓到）"; break; fi
            if [ "$(TZ=Asia/Taipei date +%H%M)" -ge 1640 ]; then echo "16:40 還沒公布，交給傍晚補抓"; exit 0; fi
            sleep 180
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/extras/oddlot_hist.csv.gz
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "櫃買盤後零股 $D（跑於 $(TZ=Asia/Taipei date '+%m-%d %H:%M')）"
          ok=0; for i in 1 2 3; do
            if git pull --rebase -X theirs && git push; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true; sleep 5
          done; [ "$ok" = 1 ]

  # 傍晚補抓（法人、本益比、融資、當沖）準時跑：GitHub 排程 18:05／21:47 常晚好幾小時（10/8～10/12 都半夜 1～4 點才跑），
  # 10/13 兩班都沒跑。每日資料是 cron-job.org 準時觸發的，跑完後在這裡自己等到 18:05、21:50 各叫一次。
  # 只有「今天下午跑出今天資料」的那次才叫（早上體檢補跑昨天的、晚到的備援班都不叫）；20 分鐘內已經有一班就不重複。
  # 一個 job 最多 6 小時，所以拆兩段。不排進 screener 佇列，不擋別的排程。
  evening1:
    needs: screen
    continue-on-error: true   # 叫不成也不要讓每日資料變紅（體檢會當成失敗寄信）
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      D: ${{ steps.w.outputs.D }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 等到 18:05 叫傍晚補抓
        id: w
        run: |
          T=$(TZ=Asia/Taipei date +%F)
          D=$(gh api "repos/$GH_REPO/contents/data/state.json?ref=main" --jq .content | base64 -d | python3 -c "import json, sys; print(json.load(sys.stdin)['last_done'])" || true)
          if [ "$D" != "$T" ] || [ "$(TZ=Asia/Taipei date +%H%M)" -ge 1800 ]; then
            echo "資料日 ${D:-?}、現在台北 $(TZ=Asia/Taipei date +%H:%M)：不用排"; exit 0; fi
          echo "D=$D" >> "$GITHUB_OUTPUT"
          while [ "$(TZ=Asia/Taipei date +%H%M)" -lt 1805 ]; do sleep 60; done
          sleep $((RANDOM % 90))   # 備援班的每日資料也在等時錯開，後面那個才看得到前面叫的
          recent=$(gh run list --workflow extras_evening.yml -L 5 --json createdAt | python3 -c "import json, sys, datetime as d; n = d.datetime.now(d.timezone.utc); print(sum((n - d.datetime.fromisoformat(x['createdAt'].replace('Z', '+00:00'))).total_seconds() < 1200 for x in json.load(sys.stdin)))" || echo 0)
          if [ "${recent:-0}" -gt 0 ]; then echo "20 分鐘內已經有傍晚補抓，不重複"; else
            gh workflow run extras_evening.yml --ref main -f date="$D" && echo "已叫傍晚補抓 $D（台北 $(TZ=Asia/Taipei date +%H:%M)）"; fi

  evening2:
    needs: evening1
    continue-on-error: true   # 叫不成也不要讓每日資料變紅（體檢會當成失敗寄信）
    if: needs.evening1.outputs.D != ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 等到 21:50 再叫一次（融資、當沖比較晚公布）
        env:
          D: ${{ needs.evening1.outputs.D }}
        run: |
          while [ "$(TZ=Asia/Taipei date +%H%M)" -lt 2150 ]; do sleep 60; done
          sleep $((RANDOM % 90))   # 備援班的每日資料也在等時錯開，後面那個才看得到前面叫的
          recent=$(gh run list --workflow extras_evening.yml -L 5 --json createdAt | python3 -c "import json, sys, datetime as d; n = d.datetime.now(d.timezone.utc); print(sum((n - d.datetime.fromisoformat(x['createdAt'].replace('Z', '+00:00'))).total_seconds() < 1200 for x in json.load(sys.stdin)))" || echo 0)
          if [ "${recent:-0}" -gt 0 ]; then echo "20 分鐘內已經有傍晚補抓，不重複"; else
            gh workflow run extras_evening.yml --ref main -f date="$D" && echo "已叫傍晚補抓 $D（台北 $(TZ=Asia/Taipei date +%H:%M)）"; fi

  deploy:
    needs: screen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:   # 跟 pages.yml 共用：新的部署進來就取消還在等的舊部署（網站只要最新那版）
      group: pages-deploy
      cancel-in-progress: true
    continue-on-error: true   # 沒開 GitHub Pages 也不會讓整個流程失敗
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
