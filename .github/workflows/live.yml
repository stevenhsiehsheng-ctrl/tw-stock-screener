name: 盤中連續監控

on:
  schedule:
    # 台北 08:45 啟動（等到開盤），後面幾個是備援（GitHub 排程偶爾延遲或漏跑）。
    # 與「盤中進場提醒」共用 concurrency，同時間只會有一個在跑；已在跑時其他的會排隊，輪到時發現已結束就直接離開。
    - cron: "45 0 * * 1-5"
    - cron: "5 1 * * 1-5"
    - cron: "35 1 * * 1-5"
    - cron: "30 2 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "測試模式（只掃一次、不等開盤、不通知）"
        type: boolean
        default: true
      hop:
        description: "（程式自己用）MIS 連不上換機器重跑的第幾次，平常不用填"
        type: number
        default: 0

permissions:
  contents: write
  issues: write
  actions: write   # 系統體檢缺資料時派工補跑（美股隔夜、傍晚補抓、每日資料）

concurrency:
  group: intraday
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 抓最新的 main（預設是觸發當下的版本，排隊期間別的排程推的資料會被漏掉，推送時二進位檔衝突）
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # 系統體檢（screener/health.py）：早上看前一個交易日的資料齊不齊，缺了自己派工補跑；
      # 收工後再查一次，還缺才寄信給 Dennis。備援班排在後面時看 data/health/latest.json 已做過就跳過。
      - name: 體檢前一個交易日（缺了自動補跑）
        if: ${{ inputs.test != true }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "$(TZ=Asia/Taipei date +%H)" -lt 11 ]; then
            python -m screener.health --slot am --heal --notify --latest
            # 早上的結果先推上去、叫網站重畫：不然要等 13:31 收工才一起推，首頁 🩺 整個上午停在昨天收工後那次（10/14）。
            # GITHUB_TOKEN 推的 commit 不會觸發 pages.yml，要自己叫。推不上去就算了，收工時會一起推
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/health
            if ! git diff --cached --quiet; then
              git commit -q -m "系統體檢 $(TZ=Asia/Taipei date +%F) 早上"
              for i in 1 2 3; do
                if git pull -q --rebase -X theirs && git push -q; then gh workflow run pages.yml --ref main || true; break; fi
                git rebase --abort 2>/dev/null || true; sleep 5
              done
            fi
          else echo "不在早上時段，跳過"; fi
      # 早上補跑的（每日資料、傍晚補抓、美股）等它跑完、拉最新的 main 再開始監控：live.py 只在啟動時讀一次資料，
      # 不等的話傍晚補抓整晚沒跑的日子（10/13 兩班都沒跑），盤中頁整天用前天的法人、不掛當沖警示。最晚等到 08:55
      - name: 等早上補跑的資料
        if: ${{ inputs.test != true }}
        continue-on-error: true
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(TZ=Asia/Taipei date +%H%M)" -lt 0855 ]; then
            python -m screener.health --wait-until 08:55
            git pull -q --rebase -X theirs || { git rebase --abort 2>/dev/null; true; }
            git log -1 --format='資料版本 %h %s'
          else echo "已過 08:55，直接開始"; fi
      - name: 盤中監控
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_HOP: ${{ inputs.hop || 0 }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python -m screener.live --test
          else
            python -m screener.live
          fi
      - name: 收工後複查
        if: ${{ always() && inputs.test != true }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "$(TZ=Asia/Taipei date +%H)" -ge 13 ]; then python -m screener.health --slot pm --notify --latest; else echo "還沒收盤（休市日或提早結束），不複查"; fi
      - name: 記錄提醒過的股票
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/positions.csv data/intraday_state.json data/live_state.json data/alerts data/group_heat data/vol_curve data/book data/touch data/lock_count.csv data/health; do [ -e "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "沒有變更"; else
            git commit -m "盤中監控 $(TZ=Asia/Taipei date +%F)"
            # 別的排程剛好也推了資料時：重試，衝突的檔案以這次新產生的為準
            ok=0; for i in 1 2 3; do
              if git pull --rebase -X theirs && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true; sleep 5
            done; [ "$ok" = 1 ]
            # 首頁收盤後那段（13:12 訊號、收工後體檢）要重畫才看得到，不然要等 15:20 每日資料（bot 推的 commit 不會觸發 pages.yml）
            if [ "${{ inputs.test }}" != "true" ]; then gh workflow run pages.yml --ref main || echo "叫網站重畫失敗（不影響資料）"; fi
          fi
