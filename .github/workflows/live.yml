name: 盤中連續監控

on:
  schedule:
    # 台北 08:45 啟動（等到開盤），後面幾個是備援（GitHub 排程偶爾延遲或漏跑）。
    # 與「盤中進場提醒」共用 concurrency，同時間只會有一個在跑；已在跑時其他的會排隊，輪到時發現已結束就直接離開。
    - cron: "45 0 * * 1-5"
    - cron: "5 1 * * 1-5"
    - cron: "35 1 * * 1-5"
    - cron: "30 2 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "測試模式（只掃一次、不等開盤、不通知）"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: intraday
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 抓最新的 main（預設是觸發當下的版本，排隊期間別的排程推的資料會被漏掉，推送時二進位檔衝突）
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 盤中監控
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python -m screener.live --test
          else
            python -m screener.live
          fi
      - name: 記錄提醒過的股票
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/positions.csv data/intraday_state.json data/live_state.json data/alerts data/group_heat data/vol_curve data/book data/touch data/lock_count.csv; do [ -e "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "沒有變更"; else
            git commit -m "盤中監控 $(TZ=Asia/Taipei date +%F)"
            # 別的排程剛好也推了資料時：重試，衝突的檔案以這次新產生的為準
            ok=0; for i in 1 2 3; do
              if git pull --rebase -X theirs && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true; sleep 5
            done; [ "$ok" = 1 ]
          fi
