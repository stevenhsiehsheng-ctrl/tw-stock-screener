name: 美股隔夜

# 美股收盤後（台北 06:20，夏令時間收盤是 04:00、冬令 05:00）抓費半、台積電 ADR、供應鏈美股，
# 存 data/us/history.csv.gz，再叫 pages.yml 重畫網站（site/us.html）。
on:
  schedule:
    - cron: "20 22 * * 1-5"   # 22:20 UTC 週一～五＝台北週二～六 06:20（對應美股週一～五）
    - cron: "20 23 * * 1-5"   # 07:20 備援（GitHub 排程常晚好幾小時；重跑一次結果一樣，取代 cron-job.org 那條）
  workflow_dispatch:
    inputs:
      research:
        description: "只跑研究：爆量突破在美股大型股（S&P 500＋那斯達克 100）5 年回測，印在 log，不存檔"
        type: boolean
        default: false
      usx_only:
        description: "只跑美股篩選（不動美股隔夜、大環境）"
        type: boolean
        default: false
      usx_backtest_years:
        description: "另外下載美股選股池 N 年日 K（研究用，推到 us-backtest 分支；留空＝不做）"
        default: ""

permissions:
  contents: write
  actions: write
  issues: write   # 風險燈變色通知（沒設 Gmail 時用 Issue）

concurrency:
  group: us
  cancel-in-progress: false

jobs:
  us:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 研究（不存檔）
        if: ${{ inputs.research }}
        run: python -m screener.us --research
      - name: 美股 N 年日 K（研究用，推到 us-backtest 分支）
        if: ${{ inputs.usx_backtest_years != '' && inputs.usx_backtest_years != null }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/usbt
          python -m screener.usx --backtest "${{ inputs.usx_backtest_years }}" /tmp/usbt/us_bt.csv.gz
          cd /tmp/usbt
          git init -q && git checkout -q -b us-backtest
          git add . && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "美股選股池 ${{ inputs.usx_backtest_years }} 年日 K $(TZ=Asia/Taipei date +%F)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" us-backtest
      - name: 只跑美股篩選
        if: ${{ inputs.usx_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m screener.usx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/usx
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -qm "美股篩選 $(TZ=Asia/Taipei date +%F)"
          ok=0; for i in 1 2 3; do
            if git pull --rebase -X theirs && git push; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true; sleep 5
          done; [ "$ok" = 1 ]
          gh workflow run pages.yml --ref main
      - name: 更新美股資料並重畫網頁
        if: ${{ !inputs.research && !inputs.usx_only && (inputs.usx_backtest_years == '' || inputs.usx_backtest_years == null) }}
        env:
          GH_TOKEN: ${{ github.token }}
          # 風險燈變色時通知 Dennis（screener.macro → notify）
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          push() {   # 推上 main（別的排程剛推過就 rebase 再推）
            ok=0; for i in 1 2 3; do
              if git pull --rebase -X theirs && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true; sleep 5
            done; [ "$ok" = 1 ]
          }
          python -m screener.us
          python -m screener.macro || echo "大環境長歷史失敗（不影響美股）"
          # 先推美股隔夜＋大環境（08:30 事故線看 regime.json），美股篩選慢、晚點另推
          for f in data/us data/extras/bench_long.csv data/macro; do [ -e "$f" ] && git add "$f"; done
          if ! git diff --cached --quiet; then git commit -qm "美股隔夜 $(TZ=Asia/Taipei date +%F)"; push; fi
          python -m screener.usx || echo "美股篩選失敗（不影響美股隔夜）"
          [ -e data/usx ] && git add data/usx
          if ! git diff --cached --quiet; then git commit -qm "美股篩選 $(TZ=Asia/Taipei date +%F)"; push || echo "美股篩選推送失敗"; fi
          gh workflow run pages.yml --ref main
