name: 下載回測用歷史資料

on:
  workflow_dispatch:
    inputs:
      years:
        description: "下載幾年"
        default: "5"
      source:
        description: "yahoo（還原權息，快）或 official（官方，慢）"
        default: "yahoo"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m screener.backfill --years ${{ inputs.years }} --source ${{ inputs.source }} --out /tmp/backtest.csv.gz
      - name: 存到 backtest-data 分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan backtest-data
          git rm -rf --quiet . || true
          cp /tmp/backtest.csv.gz backtest.csv.gz
          git add backtest.csv.gz
          if [ -e /tmp/delisted.csv ]; then cp /tmp/delisted.csv delisted.csv; git add delisted.csv; fi
          git commit -m "回測資料 $(date +%F)"
          git push -f origin backtest-data
