# ============================================================
#  台股篩選器設定檔 —— 改這個檔案就能調整篩選條件
#  修改後存檔（在 GitHub 網頁上直接編輯也可以），下次執行就會生效
# ============================================================

settings:
  markets: [TWSE, TPEX]      # TWSE = 上市，TPEX = 上櫃
  history_days: 260          # 保留多少個交易日的歷史（季線要 61 天；趨勢樣板的 MA200、52 週高低點要 260 天）
                             # 調大時會自動往前補抓（每次最多約 150 個工作日）
  source: auto               # auto：官方優先、失敗改用 Yahoo；official；yahoo
  exclude_codes: []          # 不想看的股票代號，例如 ["2330", "2317"]

# 所有策略都會先套用的基本門檻（過濾冷門股、雞蛋水餃股）
base_filter:
  - {type: volume, min: 500}         # 當日成交量至少 500 張
  - {type: price, min: 10}           # 股價至少 10 元

# ------------------------------------------------------------
#  策略：每個策略底下的條件「全部」成立才會被標記
#  同一檔股票可以同時符合多個策略
# ------------------------------------------------------------
strategies:
  - name: 爆量突破季線
    enabled: true
    conditions:
      - {type: volume_vs_prev, min: 2}      # 成交量是前一天的 2 倍以上
      - {type: cross_above_ma, period: 60}  # 今天收盤站上 60 日均線（昨天還在下面）

  - name: 漲停
    enabled: true
    conditions:
      - {type: limit_up}

  - name: 爆量長紅
    enabled: true
    conditions:
      - {type: volume_vs_avg, days: 5, min: 3}   # 成交量是前 5 日均量的 3 倍以上
      - {type: change_pct, min: 5}               # 漲幅 5% 以上
      - {type: red_candle}                       # 收紅K

  - name: 前一天爆量、今天續強
    enabled: true
    conditions:
      - {type: volume_vs_avg, days: 5, min: 2, days_ago: 1}  # 昨天量是前 5 日均量 2 倍
      - {type: change_pct, min: 0, days_ago: 1}              # 昨天收漲
      - {type: change_pct, min: 1}                           # 今天再漲 1% 以上
      - {type: above_ma, period: 20}                         # 在月線之上

  - name: 爆量突破新高（收盤確認）
    enabled: true           # 回測最佳：爆量當天收盤買、量縮一半隔天賣（盤中提醒用同樣條件）
    conditions:
      - {type: volume_vs_avg, days: 5, min: 3}
      - {type: change_pct, min: 3}
      - {type: red_candle}
      - {type: new_high, days: 60}

  - name: 強勢創新高
    enabled: true           # 回測：創60日新高＋季線上揚，6 個年度都跑贏大盤
    conditions:
      - {type: new_high, days: 60}
      - {type: ma_rising, period: 60, days: 5}

  - name: 準備突破觀察
    enabled: true           # 觀察名單（不是買進訊號）：這類股票 5 天內爆量突破新高的機率約是平均的 3 倍
    conditions:
      - {type: near_high, days: 60, pct: 5}
      - {type: new_high, days: 60, not: true}
      - {type: ma_rising, period: 60, days: 5}
      - {type: range_pct, days: 20, min: 8, max: 18}

  - name: 爆量衝高換手（長上影）
    enabled: true           # 盤中衝過 20 日高點、爆量，但被賣回來留長上影（例：10/5 強茂）。回測 5 年 8,177 筆：之後 5/10/20 日
                            # 超額 +0.1/+0.3/+0.4%、勝率約 4 成，比同條件但收高的（+0.7/+1.0/+1.2%）弱，但也不是出貨訊號
    conditions:
      - {type: volume_vs_avg, days: 5, min: 1.8}
      - {type: intraday_new_high, days: 20}
      - {type: upper_shadow, min: 4}
      - {type: volume, min: 1000}

  - name: 創60日新高且多頭排列
    enabled: false          # 改成 true 就會啟用
    conditions:
      - {type: new_high, days: 60}
      - {type: ma_bullish, periods: [5, 20, 60]}

# ------------------------------------------------------------
#  可用條件一覽（複製到上面使用）
#
#  {type: volume_vs_prev, min: 2}           量是前一日的 N 倍
#  {type: volume_vs_avg, days: 5, min: 3}   量是前 N 日均量的 M 倍
#  {type: volume, min: 1000, max: 50000}    成交量（張）範圍
#  {type: price, min: 10, max: 200}         股價範圍
#  {type: change_pct, min: 3, max: 9}       漲跌幅 % 範圍（跌就用負數）
#  {type: limit_up} / {type: limit_down}    漲停 / 跌停
#  {type: upper_shadow, min: 4}            上影線（最高 − 實體上緣）≥ 前收的 4%
#  {type: intraday_new_high, days: 60}     盤中最高價創 60 日新高
#  {type: above_ma, period: 60}             收盤在 N 日均線之上（20=月線，60=季線，240=年線）
#  {type: below_ma, period: 60}             收盤在 N 日均線之下
#  {type: cross_above_ma, period: 60}       今天剛突破 N 日均線
#  {type: cross_below_ma, period: 20}       今天剛跌破 N 日均線
#  {type: ma_rising, period: 60, days: 5}   N 日均線比 5 天前高（均線上揚）
#  {type: ma_bullish, periods: [5,20,60]}   均線多頭排列
#  {type: ma_bias, period: 20, min: 0, max: 5}   與均線乖離率 % 範圍
#  {type: new_high, days: 20}               收盤突破前 N 日最高價
#  {type: new_low, days: 20}                收盤跌破前 N 日最低價
#  {type: up_days, days: 3}                 連續上漲 N 天
#  {type: red_candle, min_body: 2}          紅K，實體至少 2%
#
#  每個條件都能加上：
#    days_ago: 1    改看 N 天前（1 = 前一天）
#    within: 3      最近 N 天內任一天成立即可（例：{type: limit_up, within: 3}）
#    not: true      反過來，不成立才算
#  注意：用到 240 日年線時，history_days 要調到 260 以上
# ------------------------------------------------------------

# 消息面／籌碼面：本益比、三大法人、月營收、注意／處置股、重大訊息、新聞
extras:
  enabled: true
  news_strategies: [爆量突破新高（收盤確認）, 強勢創新高]   # 這些策略的股票會去抓近 3 天新聞
  news_limit: 40

report:
  title: 台股每日篩選
  spark_days: 60             # 報表小走勢圖顯示幾天
  kline_days: 120            # 點名稱看 K 線的天數

email:
  enabled: true
  send_when_empty: false     # 沒有任何股票符合時是否也通知
  # 通知方式：auto = 有設定 Gmail 就用 Gmail，否則用 GitHub Issue（GitHub 會寄信到你帳號信箱）
  #           gmail / github 可強制指定
  method: auto

# ------------------------------------------------------------
#  盤中進場提醒（每個交易日約 13:12 掃描，來得及在收盤前買進）
#  回測 2021~2026：爆量當天收盤買、量縮到爆量日一半以下隔天開盤賣，
#  平均每筆跑贏大盤約 0.8%，勝率約 40%（靠少數大賺），6 年都是正報酬
# ------------------------------------------------------------
intraday:
  enabled: true
  volume_multiple: 3         # 預估全日成交量 ≥ 前 5 日均量的幾倍
  use_projected_volume: true # true = 依時間推估全日量（較接近回測）；false = 用當下實際量（較嚴）
  min_volume_lots: 500       # 目前成交量至少幾張
  min_change_pct: 3          # 漲幅至少 %
  max_change_pct: 10.5
  new_high_days: 60          # 現價突破前 N 日最高價
  min_price: 10
  exclude_industries: []     # 回測較差的產業：生技醫療業、鋼鐵工業、紡織纖維（要排除就填進來）
  weak_market_pct: -3        # 大盤過去 20 天跌超過這個 %，提醒中會加警告
  notify_when_empty: false
  # 出場（收盤後每日檢查）
  exit_shrink_ratio: 0.5     # 收盤成交量 < 爆量日 × 0.5 → 隔天開盤賣
  max_hold_days: 20
  stop_loss_pct: 0           # 0 = 不用固定停損。回測：5/7/10/15% 停損、跌回突破點、跌破爆量日開盤價都會讓報酬變差或持平

# ------------------------------------------------------------
#  盤中連續監控（09:00~13:25 每幾分鐘掃描一次，網頁 live.html 即時顯示）
#  早期預警只是「注意」，回測的進場點仍是 13:12 的正式提醒（收盤前買）
# ------------------------------------------------------------
live:
  enabled: true
  interval_min: 3            # 每幾分鐘掃描一次（太頻繁可能被證交所擋）
  alert_start: "09:30"       # 幾點後才開始記錄早期預警（太早預估量不準）
  official_time: "13:12"     # 正式進場提醒時間
  end: "13:25"
  volume_multiple: 3         # 預估全日量 ≥ 5 日均量幾倍
  min_actual_multiple: 1     # 而且目前「已成交」量至少 = 5 日均量幾倍
  min_volume_lots: 300
  min_change_pct: 3
  max_change_pct: 10.5
  new_high_days: 60
  min_price: 10
  notify: true               # 早期預警要不要寄通知
  notify_interval_min: 30    # 早期預警最多每幾分鐘彙整寄一次
  hold_drop_alert_pct: 8     # 持股盤中從進場價跌超過幾 % 通知（只是提醒，出場看量縮或 AI 研判）

# ------------------------------------------------------------
#  美股篩選（screener/usx.py；S&P 500＋那斯達克 100＋常用 ETF／ADR，每天台北 06:20 美股收盤後跑）
#  美股沒有漲跌停、一股就能買；流動性門檻用「20 日平均成交金額（百萬美元）」
#  成本：國泰複委託網路下單 個股買賣各 0.08%、不設最低（優惠到 2026/12/31；ETF 每筆 3 美元）
#        ＋賣出 SEC 規費（約 0.003%）＋買賣價差，回測抓來回 0.2%；換匯價差另計（只在進出台幣時發生）
# ------------------------------------------------------------
us_screener:
  cost_pct: 0.2
  base_filter:
    - {type: dollar_volume, days: 20, min: 20}   # 20 日平均成交金額 ≥ 2,000 萬美元
    - {type: price, min: 5}
  strategies:
    - name: 強勢創新高
      conditions:
        - {type: new_high, days: 60}
        - {type: ma_rising, period: 60, days: 5}
    - name: 爆量突破新高
      conditions:
        - {type: volume_vs_avg, days: 5, min: 2}
        - {type: change_pct, min: 3}
        - {type: red_candle}
        - {type: new_high, days: 60}
    - name: 財報跳空（Gap & Go）
      conditions:
        - {type: gap_pct, min: 4}
        - {type: volume_vs_avg, days: 20, min: 2.5}
        - {type: red_candle}
    - name: 準備突破觀察
      conditions:
        - {type: near_high, days: 60, pct: 5}
        - {type: new_high, days: 60, not: true}
        - {type: ma_rising, period: 60, days: 5}
        - {type: range_pct, days: 20, min: 6, max: 15}
    - name: 爆量長紅
      conditions:
        - {type: volume_vs_avg, days: 5, min: 2}
        - {type: change_pct, min: 4}
        - {type: red_candle}
    - name: 爆量突破季線
      conditions:
        - {type: volume_vs_prev, min: 2}
        - {type: cross_above_ma, period: 60}
    - name: 跌深反彈候選
      conditions:
        - {type: above_ma, period: 200}
        - {type: ma_bias, period: 20, max: -8}
        - {type: change_pct, min: 0}
